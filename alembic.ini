# A generic, single database configuration.

[alembic]

script_location = %(here)s/migrations


prepend_sys_path = .

path_separator = os

# Real URL is loaded from app.core.config.Settings (settings.DATABASE_URL)
sqlalchemy.url = postgresql://user:password@localhost:5432/mini_auth_api_key_db

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
